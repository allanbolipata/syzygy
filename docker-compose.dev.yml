# Local-development override, layered ON docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# It adds the two services the app needs locally — its Postgres (the
# production file bundles no database) and a dev Keycloak with its own
# Postgres — and overrides the app's env with dev values. Production
# runs docker-compose.yml alone and points DATABASE_URL / KEYCLOAK_URL
# / KEYCLOAK_CLIENT_SECRET at external services.
name: syzygy

services:
  app:
    # The dev database sits on the shared network as `db`. The host-side
    # app (run from .venv for local logins) reaches it at 127.0.0.1:5435
    # via .env (see .env.example).
    #
    # The in-container app exists here as the NATS ingest target for the
    # standalone smile-listener (reachable in-network at http://app:8123).
    # It is deliberately NOT published on the host: browser login stays on
    # the host-side uvicorn (issuer pitfall — the app must see the
    # browser-side Keycloak URL, which only works from the host).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8123"]
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/app
      KEYCLOAK_URL: http://localhost:8080
      # Shared secret the smile-listener sends as X-NATS-Token.
      NATS_INGEST_TOKEN: dev-syzygy-nats-token
    # Note: podman-compose concatenates list-valued keys across compose
    # files, so the base file's healthcheck (probing 8000) cannot be
    # overridden here. In dev the container app serves 8123 and therefore
    # reports unhealthy — cosmetic; nothing depends on the app's health.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syzygy-dev

  # Dev-only NATS server with JetStream enabled — required: the SMILE
  # subjects are stored on the MDB_STREAM JetStream stream. (The official
  # NATS image is the Docker library image `nats`; natsio/nats does not
  # exist on Docker Hub.)
  nats:
    image: nats:2.15.2
    # The official image's entrypoint IS the nats-server wrapper, so the
    # command carries flags only (no "nats-server" token).
    command: ["-js", "-http_port", "8222"]
    container_name: syzygy-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - syzygy-dev
    restart: unless-stopped

  # One-shot bootstrap: create the JetStream stream MDB_STREAM
  # idempotently. Runs to completion before the listener starts and never
  # restarts.
  nats-init:
    build: ./listener
    command: ["python", "/app/init_nats_stream.py"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
    networks:
      - syzygy-dev
    restart: "no"

  # Standalone smile-client consumer: one durable consumer on the wildcard
  # MDB_STREAM.server.cpt-gateway.> receives all three cmo subjects and
  # POSTs each message to the app's internal ingest endpoint.
  smile-listener:
    build: ./listener
    command: ["python", "/app/run.py"]
    environment:
      NATS_URL: nats://nats:4222
      NATS_FILTER_SUBJECT: "MDB_STREAM.server.cpt-gateway.>"
      NATS_DURABLE: "syzygy"
      SYZYGY_APP_URL: http://app:8123
      SYZYGY_NATS_TOKEN: dev-syzygy-nats-token
    depends_on:
      nats-init:
        condition: service_completed_successfully
    networks:
      - syzygy-dev
    restart: unless-stopped

  # Dev-only database, NOT part of the production stack.
  db:
    image: postgres:17
    container_name: syzygy-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # 5435, not 5432: the host's own Postgres owns 5432 and serves
      # other dev databases (beagle).
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - syzygy-dev
    restart: unless-stopped

  # Dev-only Keycloak. Production points KEYCLOAK_URL at the externally
  # managed org Keycloak instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    container_name: syzygy-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak stores its own config (realms, clients, users) in the
      # dedicated keycloak-db Postgres instead of the in-container H2
      # file, so the client/user setup survives `docker compose down`.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Keycloak 26 serves /health/ready on the management interface
      # (port 9000) by default; these keep health enabled on the main
      # HTTP interface (8080) so the in-container healthcheck below works.
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "false"
    # Default Keycloak port.
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget/nc, and its bash (RHEL build) lacks
      # /dev/tcp, so the probe is a tiny JEP 330 Java program run by the
      # JRE keycloak ships (java.net.http is in the JDK).
      test: ["CMD-SHELL", 'printf "public class Probe { public static void main(String[] a) throws Exception { var r = java.net.http.HttpClient.newHttpClient().send(java.net.http.HttpRequest.newBuilder(java.net.URI.create(\\042http://localhost:8080/health/ready\\042)).build(), java.net.http.HttpResponse.BodyHandlers.discarding()); System.exit(r.statusCode() == 200 ? 0 : 1); } }" > /tmp/kc_probe.java && java /tmp/kc_probe.java']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - syzygy-dev
    restart: unless-stopped

  # Keycloak's own database. Not published on the host; reach it with
  # `docker compose -f docker-compose.yml -f docker-compose.dev.yml
  # exec keycloak-db psql -U keycloak keycloak` (or uncomment the mapping
  # for host access):
  #   ports:
  #     - "5436:5432"
  keycloak-db:
    image: postgres:16
    container_name: syzygy-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - syzygy-dev
    restart: unless-stopped

networks:
  syzygy-dev:
    # Pin the literal Docker network name (compose would otherwise
    # prefix it with the project name).
    name: syzygy-dev

volumes:
  db_data:
  keycloak_db_data:
