name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  # The README quickstart is a contract; this job enforces it. Both
  # .env.example incidents (redacted-password ***, missing NATS_URL)
  # passed CI green because nothing ever touched the file untouched.
  quickstart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: .env.example must be complete and uncorrupted
        run: |
          if grep -q '\*\*\*@' .env.example; then
            echo "::error::.env.example contains a redacted credential (***); a sandbox redactor corrupted a committed write."; exit 1; fi
          cp .env.example .env
          # Fails at parse time if any ${VAR:?required} in either compose
          # file lacks a value (compose interpolates per-file, before merges).
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Zero-Docker seed smoke (README quickstart variant)
        run: |
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=sqlite:///./syzygy_smoke.db|' .env
          python scripts/seed_dev_data.py | tee seed.log
          grep -q "Total: 25 samples, 10 pairing rows, 3 unmatched tumors" seed.log \
            || { echo "::error::seed ground-truth counts changed — update the README Expected state table in the same PR."; exit 1; }

  # The Postgres-backed modules (generated-column migration, DMP perf
  # guard) silently SKIP when DATABASE_URL is not Postgres — which is the
  # case in the job above. This job runs them against a real Postgres 17
  # (the production compose image) and fails if any test skips, so the
  # generated-column DDL can never rot unnoticed.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Postgres-backed tests (any skip fails the job)
        run: |
          set -o pipefail
          pytest tests/test_dmp_generated_columns.py \
                 tests/test_dmp_perf_guard_e2e.py \
                 tests/test_schema_check.py -v | tee pg.log
          if grep -qE "[0-9]+ skipped" pg.log; then
            echo "::error::Postgres-backed tests were SKIPPED — the CI" \
                 "database is not usable (need CREATEDB) or DATABASE_URL" \
                 "is not Postgres."
            exit 1
          fi
