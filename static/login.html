<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syzygy login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Syzygy <span class="sub">login</span></h1>
</header>

<main class="view">
  <section class="panel">
    <h2>Sign in</h2>
    <p>Sign in with your Keycloak account</p>
    <div class="actions">
      <button type="button" class="primary" id="btn-signin">Sign in with Keycloak</button>
    </div>
  </section>
</main>

<footer class="foot">Syzygy dev UI &mdash; no-build static front end served by FastAPI at <code>/ui</code></footer>
<script>
  document.getElementById("btn-signin").addEventListener("click", function () {
    location.href = "/auth/redirect";
  });
  // Redirect straight to the UI when a session is already valid;
  // otherwise (401/403/404 or network error) leave the sign-in button visible.
  fetch("/v1/auth/me")
    .then(function (r) {
      if (r.ok) {
        location.href = "/ui";
      }
    })
    .catch(function () {
      /* no session: stay on this page */
    });
</script>
</body>
</html>
