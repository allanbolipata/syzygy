[alembic]
# Path to migration scripts
script_location = alembic

# Template used when generating new revision files
file_template = %%(rev)s_%%(slug)s

# sys.path prepended when running Python
prepend_sys_path = .

# The URL is injected at runtime from app settings (DATABASE_URL env var),
# so it stays empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
