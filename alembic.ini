# A generic, single-database configuration for the syzygy app.

[alembic]
# path to migration scripts (relative to this file).
script_location = alembic

# prepend the repo root so `import syzygy` works when alembic runs.
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally NOT set here: alembic/env.py injects
# the app's configured URL (syzygy.database.settings.database_url, i.e.
# the same DATABASE_URL from .env the app uses). No hard-coded URL.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
