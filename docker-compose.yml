# Syzygy app — production base.
#
# This is the production stack: the app, its Postgres (`db`), and the
# standalone smile-listener (the ONLY path by which SMILE / DMP / cohort
# messages reach the app — the app itself never connects to NATS), so a
# production deployment is a single `docker compose up -d`. Keycloak
# remains EXTERNAL (org-managed), and so does NATS/JetStream: the
# listener's NATS_URL points at the org-run SMILE gateway server.
#
# `listener/init_nats_stream.py` (the dev stack's nats-init bootstrap)
# is deliberately NOT bundled here: in production MDB_STREAM belongs to
# the gateway team and must not be mutated from this stack without their
# agreement (docs/nats_topics.md).
#
# The database data lives on the HOST, not in the container:
#   - set PG_DATA_DIR to a host directory → bind mount (recommended
#     for production);
#   - leave PG_DATA_DIR unset → the named volume db_data.
#
# For local development, layer docker-compose.dev.yml on top — it
# adapts the bundled db for dev (dev credentials, port 5435, dev
# network) and adds a local dev Keycloak, its own Postgres, and the
# dev NATS stack:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# For a production run, set the required variables on the command line
# (shell environment wins over any .env in this directory):
#   DATABASE_URL=... KEYCLOAK_URL=... KEYCLOAK_CLIENT_SECRET=*** \
#     NATS_URL=... NATS_INGEST_TOKEN=*** \
#     docker compose up -d
name: syzygy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sample-pairing-app
    container_name: syzygy-app
    # The Dockerfile CMD runs uvicorn on port 8000, which matches the
    # healthcheck below and the 8000:8000 port mapping.
    environment:
      # Required: the database this app uses. The bundled `db` service
      # below is the default target in production; deployments may also
      # point at their own external Postgres.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL, e.g. postgresql+psycopg2://syzygy:PASSWORD@db:5432/syzygy (the bundled db) or an external database}
      # KEYCLOAK_URL must be the same URL the BROWSER uses: the token's
      # issuer claim is stamped from the browser-side authorize request,
      # so a mismatch makes every login 401. In production this is the
      # externally managed org Keycloak.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-syzygy}
      # Read from the environment or this directory's .env (compose loads
      # .env automatically). Never commit the value.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # Shared secret for the listener's POSTs to /v1/ingest/nats and the
      # publish-outbox drain (sent as X-NATS-Token). Fail-closed: unset
      # DISABLES both endpoints. The SAME variable feeds the listener's
      # SYZYGY_NATS_TOKEN below, so the two sides cannot drift.
      NATS_INGEST_TOKEN: ${NATS_INGEST_TOKEN:?set NATS_INGEST_TOKEN, the shared X-NATS-Token secret for the smile-listener}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Single-quoted CMD-SHELL scalar: compose v2.33 re-tokenizes
      # double-quoted flow-sequence entries (it split the old -c probe
      # into 8 argv entries), but single-quoted ones pass through intact.
      test: ["CMD-SHELL", 'python -c ''import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The app's Postgres, bundled so a production deployment needs no
  # external database. Data lives on the host: with PG_DATA_DIR set the
  # mount is a bind to that host directory (recommended for prod); with
  # PG_DATA_DIR unset it is the named volume db_data. NOT published on
  # the host — the app reaches it over the compose network as db:5432.
  #
  # docker-compose.dev.yml overrides this service's environment (dev
  # credentials) and adds its port and network. It must NOT re-declare
  # the service's volumes or healthcheck: compose merges files by
  # concatenating list-valued keys, so a second declaration would yield
  # two mounts at /var/lib/postgresql/data and an invalid healthcheck.
  db:
    image: postgres:17
    container_name: syzygy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syzygy}
      # Weak default for local runs; production must set a strong
      # POSTGRES_PASSWORD and use the same value in DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syzygy}
      POSTGRES_DB: ${POSTGRES_DB:-syzygy}
    healthcheck:
      # Probes TCP 5432 without credentials — valid for any user.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PG_DATA_DIR set → bind mount to that host directory (on a Linux
      # host, chown -R 999:999 it first); unset → named volume db_data.
      - ${PG_DATA_DIR:-db_data}:/var/lib/postgresql/data
    # For host access, uncomment (the dev file maps 5435:5432 instead):
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  # Standalone SMILE listener: the ONLY way inbound SMILE / DMP / cohort
  # messages reach the app (the app never connects to NATS itself). One
  # process, two supervised JetStream consumers (legacy `MDB_STREAM.server.>`
  # durable syzygy, tempo `MDB_STREAM.consumers.tempo.>` durable syzygy-tmp;
  # see listener/run.py), each POSTing to the app's internal ingest
  # endpoint with X-NATS-Token. Consumers restart themselves with backoff;
  # `restart: unless-stopped` covers a hard crash.
  #
  # Run exactly ONE instance: the durable names fan out per-stream, so a
  # second instance would share a durable and load-balance deliveries
  # instead of shadowing. Also confirm no other org consumer (e.g. beagle)
  # already holds durables named syzygy / syzygy-tmp on the prod stream.
  #
  # NATS_URL is REQUIRED and points at the org-run SMILE gateway's
  # JetStream server — there is no bundled nats service in production and
  # no nats-init bootstrap here (MDB_STREAM is the gateway team's stream;
  # coordinate before creating/updating subjects on it).
  #
  # The subject/durable defaults below match listener/run.py and
  # docs/nats_topics.md; override only by agreement (e.g. the cohort-result
  # subject rename is still pending). COHORT_PUBLISH_ENABLED stays off by
  # default: it arms the listener-side outbox flusher that republishes
  # staged cohort reports to NATS_RESULT_SUBJECT.
  smile-listener:
    build:
      context: ./listener
    image: syzygy-smile-listener
    environment:
      NATS_URL: ${NATS_URL:?set NATS_URL, e.g. nats://prod-nats-host:4222 (the org SMILE gateway)}
      NATS_FILTER_SUBJECT: ${NATS_FILTER_SUBJECT:-MDB_STREAM.server.>}
      NATS_DURABLE: ${NATS_DURABLE:-syzygy}
      NATS_TEMPO_FILTER_SUBJECT: ${NATS_TEMPO_FILTER_SUBJECT:-MDB_STREAM.consumers.tempo.>}
      NATS_TEMPO_DURABLE: ${NATS_TEMPO_DURABLE:-syzygy-tmp}
      # In-network app target (the prod app serves 8000; 8123 is dev-only).
      SYZYGY_APP_URL: ${SYZYGY_APP_URL:-http://app:8000}
      # Same host variable as the app's NATS_INGEST_TOKEN above — the two
      # sides structurally cannot drift.
      SYZYGY_NATS_TOKEN: ${NATS_INGEST_TOKEN:?set NATS_INGEST_TOKEN, the shared X-NATS-Token secret for the smile-listener}
      NATS_RESULT_SUBJECT: ${NATS_RESULT_SUBJECT:-MDB_STREAM.consumers.tempo.cohort-result}
      COHORT_PUBLISH_ENABLED: ${COHORT_PUBLISH_ENABLED:-false}
      COHORT_FLUSH_INTERVAL: ${COHORT_FLUSH_INTERVAL:-30}
      # Optional NATS auth/TLS (run.py omits any that is empty; cert/key
      # paths are IN-container, so mount them if used):
      # NATS_USERNAME: ${NATS_USERNAME:-}
      # NATS_PASSWORD: ${NATS_PASSWORD:-}
      # NATS_SSL_CERTFILE: ${NATS_SSL_CERTFILE:-}
      # NATS_SSL_KEYFILE: ${NATS_SSL_KEYFILE:-}
      # NATS_ROOT_CA: ${NATS_ROOT_CA:-}
    # service_started, not service_healthy: the compose-merged dev stack
    # reports the in-container app unhealthy (its healthcheck probes 8000
    # while dev serves 8123), and the listener tolerates a briefly absent
    # app anyway (failed POSTs are retried / left pending).
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
